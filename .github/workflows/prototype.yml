name: Fork prototype
on:
  push:
    branches: [prototype/local-shield]
    paths: ["prototype/**", "demo/**", ".github/workflows/prototype.yml"]
  pull_request:
    paths: ["prototype/**", "demo/**", ".github/workflows/prototype.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
        working-directory: prototype
      - run: npx playwright install --with-deps chromium
        working-directory: prototype
      - run: npm run build && npm test
        working-directory: prototype
      - name: Studio and installed-extension checks
        working-directory: prototype
        run: |
          node server.mjs > /tmp/flashban-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          node test/extension.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-browser-evidence
          path: |
            prototype/artifacts/*.png
            prototype/artifacts/*results.json
