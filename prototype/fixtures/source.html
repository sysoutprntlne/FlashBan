<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FlashBan extension fixture</title>
    <style>
      body {
        font: 18px system-ui;
        margin: 40px;
        max-width: 900px;
        background: #f6f7f1;
        color: #143b35;
      }
      button {
        font: inherit;
        padding: 12px;
      }
      canvas {
        display: block;
        width: 640px;
        max-width: 100%;
        height: 360px;
        margin-top: 20px;
        background: #163f40;
      }
    </style>
  </head>
  <body>
    <h1>Extension validation fixture</h1>
    <p>
      Synthetic test source. The installed extension should guard this canvas
      during warm-up, then shield rapid luminance changes. Do not run without
      the extension or if anyone viewing the screen may be photosensitive.
    </p>
    <button id="start">Start controlled canvas</button>
    <button id="stop">Stop</button>
    <p id="status" role="status">Stopped.</p>
    <canvas
      width="640"
      height="360"
      aria-label="Synthetic test canvas"
    ></canvas>
    <script src="/fixtures/source.js"></script>
  </body>
</html>
