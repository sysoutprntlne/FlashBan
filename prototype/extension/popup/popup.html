<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Seizure Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Seizure Shield <span class="tag">prototype</span></h1>
    <p class="note">Covers fast-flashing video, canvas and CSS-animated elements. Not a medical device and not guaranteed protection. Events stay on this device and store only the site hostname.</p>
    <h2 id="events-heading">Recent events</h2>
    <p id="empty">No events yet.</p>
    <ol id="events" aria-labelledby="events-heading"></ol>
    <button id="clear" type="button">Clear events</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
